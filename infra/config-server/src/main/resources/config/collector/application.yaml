server:
  port: 0

grpc:
  server:
    port: 0

spring:
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.LongSerializer
      value-serializer: ewm.stats.collector.kafka.AvroSerializer
      acks: all
      properties:
        linger.ms: 100

collector:
  kafka:
    topics:
      user-actions: stats.user-actions.v1