server:
  port: 0

client:
  url: http://localhost:9090

spring:
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5434/stats
    username: user
    password: password
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always

format:
  pattern:
    datetime: yyyy-MM-dd HH:mm:ss